services:
  - type: web
    name: stock-bot
    env: python
    pythonVersion: 3.11.11
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: stockbot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /tmp/data
      - key: DB_PATH
        value: /tmp/data/bot.db
      - key: CACHE_DIR
        value: /tmp/data/_cache
      - key: NAMES_FILE
        value: /opt/render/project/src/names.json
      - key: CACHE_TTL_SEC
        value: "300"
      - key: LOOKBACK_DAYS
        value: "120"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false

  - type: cron
    name: stock-bot-daily
    env: python
    pythonVersion: 3.11.11
    schedule: "0 1 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python stock.py
    
    envVars:
      - key: DATA_DIR
        value: /tmp/data
      - key: DB_PATH
        value: /tmp/data/bot.db
      - key: CACHE_DIR
        value: /tmp/data/_cache
      - key: NAMES_FILE
        value: /opt/render/project/src/names.json
      - key: CACHE_TTL_SEC
        value: "300"
      - key: LOOKBACK_DAYS
        value: "120"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
    